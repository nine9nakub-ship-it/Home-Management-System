<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการการบ้าน | Homework Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] } } }
    }
  </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col selection:bg-blue-100 selection:text-blue-900">

  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- ==========================================
       LOGIN & ROOM SELECTION SCREEN
       ========================================== -->
  <div id="login-screen" class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-100 p-8 text-center relative overflow-hidden">
      <!-- Decor -->
      <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl"></div>
      
      <div class="w-16 h-16 mx-auto bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-blue-500/30 mb-4">
        <span class="text-3xl">🏫</span>
      </div>
      <h1 class="text-2xl font-bold text-slate-800 mb-2">ระบบจัดการการบ้าน</h1>
      <p class="text-sm text-slate-500 mb-6">กรอกรหัสผ่าน (PIN) เพื่อเข้าสู่ห้องเรียนของคุณ</p>

      <form id="global-login-form" class="space-y-4 mb-6">
        <input type="password" id="global-pin-input" placeholder="รหัสห้องเรียน" required class="w-full text-center tracking-[0.5em] text-xl px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 font-bold text-slate-700">
        <button type="submit" class="w-full py-3 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 shadow-md transition-all">เข้าสู่ระบบ</button>
      </form>

      <div class="relative flex py-3 items-center mb-6">
        <div class="flex-grow border-t border-slate-200"></div>
        <span class="flex-shrink-0 mx-4 text-slate-400 text-xs">หรือ</span>
        <div class="flex-grow border-t border-slate-200"></div>
      </div>

      <button onclick="openCreateRoomModal()" class="w-full py-3 rounded-xl border-2 border-dashed border-blue-200 text-blue-600 font-semibold hover:bg-blue-50 hover:border-blue-300 transition-colors flex items-center justify-center gap-2">
        <i data-lucide="plus-circle" class="w-5 h-5"></i> สร้างห้องเรียนใหม่
      </button>
    </div>
  </div>

  <!-- ==========================================
       MAIN DASHBOARD SCREEN
       ========================================== -->
  <div id="main-dashboard" class="hidden flex-1 flex flex-col">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16 sm:h-20">
          <div class="flex items-center gap-3">
            <button onclick="leaveRoom()" class="p-2 -ml-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-100 transition-colors" title="ออกจากห้อง">
              <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </button>
            <div>
              <h1 class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight">
                ห้อง <span id="room-name-display" class="text-blue-600"></span>
              </h1>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="openMembersModal()" class="flex px-3 py-2 text-slate-600 hover:bg-slate-100 rounded-xl text-xs font-medium transition-colors items-center gap-1.5 border border-slate-200">
              <i data-lucide="users" class="w-4 h-4"></i> จัดการสมาชิก
            </button>
            <button onclick="openAddTaskModal()" class="px-3.5 py-2 sm:px-4 sm:py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white rounded-xl text-xs sm:text-sm font-semibold shadow-sm transition-all flex items-center gap-1.5">
              <i data-lucide="plus-circle" class="w-4 h-4"></i><span class="hidden sm:inline">เพิ่มการบ้าน</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full space-y-6">
      
      <!-- Announcement -->
      <div id="announcement-banner" class="hidden bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-2xl p-4 sm:p-5 shadow-sm relative overflow-hidden">
        <div class="flex items-start justify-between gap-3 relative z-10">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-white/20 flex items-center justify-center flex-shrink-0"><i data-lucide="megaphone" class="w-5 h-5"></i></div>
            <div>
              <div class="text-xs font-semibold uppercase text-amber-100">ประกาศห้อง</div>
              <p id="announcement-text" class="text-sm font-medium mt-0.5"></p>
            </div>
          </div>
          <div class="flex items-center gap-1">
            <button onclick="editAnnouncement()" class="p-1.5 hover:bg-white/20 rounded-lg text-white/90"><i data-lucide="pencil" class="w-4 h-4"></i></button>
            <button onclick="toggleAnnouncement()" class="p-1.5 hover:bg-white/20 rounded-lg text-white/90"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
        </div>
      </div>

      <!-- Stats -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-xs flex justify-between">
          <div><p class="text-xs font-medium text-slate-500">งานทั้งหมด</p><h3 id="stat-total" class="text-2xl font-bold mt-1">0</h3></div>
          <div class="w-11 h-11 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center"><i data-lucide="book-open" class="w-5 h-5"></i></div>
        </div>
        <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-xs">
          <div class="flex justify-between">
            <div><p class="text-xs font-medium text-slate-500">เสร็จ 100%</p><h3 id="stat-completed" class="text-2xl font-bold text-emerald-600 mt-1">0</h3></div>
            <div class="w-11 h-11 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div>
          </div>
          <div class="mt-3"><div class="flex justify-between text-[11px] text-slate-400 mb-1"><span>อัตราส่งงานรวม</span><span id="stat-progress-text" class="font-semibold text-emerald-600">0%</span></div><div class="w-full h-2 bg-slate-100 rounded-full"><div id="stat-progress-bar" class="h-full bg-emerald-500 rounded-full transition-all" style="width: 0%"></div></div></div>
        </div>
        <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-xs flex justify-between">
          <div><p class="text-xs font-medium text-slate-500">ยังไม่ครบ</p><h3 id="stat-pending" class="text-2xl font-bold text-amber-600 mt-1">0</h3></div>
          <div class="w-11 h-11 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center"><i data-lucide="clock" class="w-5 h-5"></i></div>
        </div>
        <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-xs flex justify-between">
          <div><p class="text-xs font-medium text-slate-500">งานด่วน</p><h3 id="stat-urgent" class="text-2xl font-bold text-rose-600 mt-1">0</h3></div>
          <div class="w-11 h-11 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center"><i data-lucide="alert-circle" class="w-5 h-5"></i></div>
        </div>
      </div>

      <!-- Filters -->
      <div class="space-y-3">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 bg-white p-3 rounded-2xl border border-slate-200/80 shadow-xs">
          <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl overflow-x-auto">
            <button data-status="all" onclick="setStatusFilter('all')" class="status-filter-btn px-4 py-1.5 rounded-lg text-xs font-semibold bg-white text-blue-600 shadow-xs">ทั้งหมด</button>
            <button data-status="pending" onclick="setStatusFilter('pending')" class="status-filter-btn px-4 py-1.5 rounded-lg text-xs font-medium text-slate-600">ยังไม่เสร็จ</button>
            <button data-status="completed" onclick="setStatusFilter('completed')" class="status-filter-btn px-4 py-1.5 rounded-lg text-xs font-medium text-slate-600">ส่งครบแล้ว</button>
            <button data-status="group" onclick="setStatusFilter('group')" class="status-filter-btn px-4 py-1.5 rounded-lg text-xs font-medium text-slate-600">งานกลุ่ม</button>
          </div>
          <div class="flex items-center gap-2">
            <div class="relative flex-1 sm:w-64"><i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i><input type="text" id="search-input" placeholder="ค้นหางาน..." class="w-full pl-9 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-blue-500"></div>
            <select id="sort-select" class="text-xs bg-slate-50 border border-slate-200 rounded-xl px-2 py-1.5 focus:ring-2 focus:ring-blue-500">
              <option value="due-asc">กำหนดส่ง: ใกล้สุด</option>
              <option value="due-desc">กำหนดส่ง: ไกลสุด</option>
              <option value="assigned-desc">วันที่สั่ง: ล่าสุด</option>
            </select>
            <div class="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
              <button id="view-mode-card" onclick="setViewMode('card')" class="p-1.5 rounded-lg bg-white text-blue-600 shadow-xs"><i data-lucide="layout-grid" class="w-4 h-4"></i></button>
              <button id="view-mode-table" onclick="setViewMode('table')" class="p-1.5 rounded-lg text-slate-500"><i data-lucide="list" class="w-4 h-4"></i></button>
            </div>
          </div>
        </div>
        <div id="subject-filter-container" class="flex items-center gap-1.5 overflow-x-auto pb-1"></div>
      </div>

      <div id="tasks-container"></div>
    </main>
  </div>

  <!-- ==========================================
       MODALS
       ========================================== -->
  


  <!-- Create Room Modal -->
  <div id="create-room-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-slate-800 mb-4">สร้างห้องเรียนใหม่</h3>
      <form id="create-room-form" class="space-y-4 text-sm">
        <div>
          <label class="block font-medium text-slate-700 mb-1">ชื่อห้องเรียน / ระดับชั้น</label>
          <input type="text" id="new-room-name" placeholder="เช่น ม.5/1" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl">
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">รหัสผ่านห้อง (PIN)</label>
          <input type="text" id="new-room-pin" placeholder="ตั้งรหัสผ่านสำหรับเข้าห้อง" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl">
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeCreateRoomModal()" class="flex-1 py-2 rounded-xl text-slate-600 hover:bg-slate-100">ยกเลิก</button>
          <button type="submit" class="flex-1 py-2 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700">สร้างห้อง</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Manage Members Modal -->
  <div id="members-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl flex flex-col max-h-[85vh]">
      <div class="flex items-center justify-between pb-4 border-b border-slate-100">
        <h3 class="text-base font-bold text-slate-800">จัดการสมาชิกในห้อง</h3>
        <button onclick="closeMembersModal()" class="p-1 rounded-xl text-slate-400 hover:bg-slate-100"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      
      <div class="flex gap-2 p-1 bg-slate-100 rounded-xl mt-4">
        <button id="tab-btn-students" onclick="switchMemberTab('students')" class="flex-1 py-1.5 text-sm font-medium rounded-lg bg-blue-600 text-white shadow-sm transition-all">รายชื่อนักเรียน</button>
        <button id="tab-btn-groups" onclick="switchMemberTab('groups')" class="flex-1 py-1.5 text-sm font-medium rounded-lg text-slate-600 hover:text-slate-900 transition-all">รายชื่อกลุ่ม</button>
      </div>

      <!-- Students Tab -->
      <div id="tab-content-students" class="mt-4 flex-1 overflow-y-auto flex flex-col gap-3 min-h-0">
        <div class="flex gap-2">
          <input type="text" id="new-student-input" placeholder="เพิ่มชื่อ-นามสกุล..." class="flex-1 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
          <button onclick="addMember('students')" class="px-3 py-1.5 bg-slate-800 text-white rounded-xl text-sm"><i data-lucide="plus" class="w-4 h-4"></i></button>
        </div>
        <button onclick="addMultipleStudents()" class="text-xs text-blue-600 hover:underline text-left">+ เพิ่มรายชื่อหลายคนพร้อมกัน (Copy จาก Excel วางได้เลย)</button>
        <div id="students-list" class="border border-slate-100 rounded-xl overflow-y-auto max-h-64"></div>
      </div>

      <!-- Groups Tab -->
      <div id="tab-content-groups" class="hidden mt-4 flex-1 overflow-y-auto flex flex-col gap-3 min-h-0">
        <div class="flex gap-2">
          <input type="text" id="new-group-input" placeholder="เพิ่มชื่อกลุ่ม..." class="flex-1 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-sm">
          <button onclick="addMember('groups')" class="px-3 py-1.5 bg-slate-800 text-white rounded-xl text-sm"><i data-lucide="plus" class="w-4 h-4"></i></button>
        </div>
        <div id="groups-list" class="border border-slate-100 rounded-xl overflow-y-auto max-h-64"></div>
      </div>
    </div>
  </div>

  <!-- Checklist Modal -->
  <div id="checklist-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl flex flex-col max-h-[80vh]">
      <div class="flex justify-between items-start pb-4 border-b border-slate-100">
        <div class="pr-4">
          <h3 class="text-xs font-semibold text-blue-600 uppercase mb-1">เช็คชื่อส่งงาน</h3>
          <h2 id="checklist-task-title" class="text-base font-bold text-slate-800 leading-tight"></h2>
        </div>
        <button onclick="closeChecklistModal()" class="p-1 rounded-xl text-slate-400 hover:bg-slate-100 shrink-0"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      
      <div class="py-3 px-2 flex justify-between items-center text-sm font-semibold border-b border-slate-100 bg-slate-50 mt-2 rounded-t-xl">
        <span class="text-slate-700">รายชื่อ</span>
        <span id="checklist-summary" class="text-blue-600"></span>
      </div>
      
      <div id="checklist-container" class="overflow-y-auto flex-1 bg-white border border-t-0 border-slate-100 rounded-b-xl border-x">
        <!-- Checklist items -->
      </div>
      
      <button onclick="closeChecklistModal()" class="mt-4 w-full py-2.5 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700">บันทึกและปิด</button>
    </div>
  </div>

  <!-- Add/Edit Task Modal -->
  <div id="task-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-4 border-b border-slate-100">
        <h3 id="modal-task-title-header" class="text-base font-bold text-slate-800">เพิ่มการบ้าน</h3>
        <button onclick="closeTaskModal()" class="p-1 rounded-xl text-slate-400 hover:bg-slate-100"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="task-form" class="space-y-4 mt-4 text-xs">
        <input type="hidden" id="task-id-input">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="sm:col-span-2">
            <label class="block font-medium text-slate-700 mb-1">ชื่อวิชา *</label>
            <input type="text" id="task-subject-name" list="existing-subjects-list" required class="w-full px-3 py-2 bg-slate-50 border rounded-xl">
            <datalist id="existing-subjects-list"></datalist>
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">รหัสวิชา</label>
            <input type="text" id="task-subject-code" class="w-full px-3 py-2 bg-slate-50 border rounded-xl">
          </div>
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">ครูผู้สอน</label>
          <input type="text" id="task-teacher" list="existing-teachers-list" class="w-full px-3 py-2 bg-slate-50 border rounded-xl">
          <datalist id="existing-teachers-list"></datalist>
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">ชื่องาน *</label>
          <input type="text" id="task-title" required class="w-full px-3 py-2 bg-slate-50 border rounded-xl">
        </div>
        <div class="flex items-center gap-2 p-3 bg-amber-50 rounded-xl border border-amber-200">
          <input type="checkbox" id="task-is-group" class="w-4 h-4 text-blue-600 rounded">
          <label for="task-is-group" class="font-medium text-amber-900 cursor-pointer">เป็นงานกลุ่ม (Group Assignment)</label>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block font-medium text-slate-700 mb-1">วันที่สั่ง</label>
            <input type="date" id="task-assigned-date" class="w-full px-3 py-2 bg-slate-50 border rounded-xl">
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">กำหนดส่ง</label>
            <input type="date" id="task-due-date" class="w-full px-3 py-2 bg-slate-50 border rounded-xl">
          </div>
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">หมายเหตุ</label>
          <textarea id="task-notes" rows="2" class="w-full px-3 py-2 bg-slate-50 border rounded-xl"></textarea>
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">สีประจำวิชา</label>
          <select id="task-color" class="w-full px-3 py-2 bg-slate-50 border rounded-xl">
            <option value="blue">น้ำเงิน</option>
            <option value="emerald">เขียว</option>
            <option value="purple">ม่วง</option>
            <option value="amber">ส้ม</option>
            <option value="rose">แดง</option>
          </select>
        </div>
        <div class="flex gap-2 pt-4 border-t border-slate-100">
          <button type="button" onclick="closeTaskModal()" class="flex-1 py-2 rounded-xl text-slate-600 hover:bg-slate-100">ยกเลิก</button>
          <button type="submit" class="flex-1 py-2 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700">บันทึก</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="app.js"></script>
</body>
</html>
